<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Productos | Tienda Sara</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
<main class="container py-4">
    <h1 class="mb-3">Productos</h1>

    <a class="btn btn-primary mb-3" th:href="@{/products/create}">
        Agregar producto
    </a>

    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead>
            <tr>
                <th>ID</th>
                <th>Descripción</th>
                <th>Precio</th>
                <th>Cantidad</th>
                <th>Categoría</th>
                <th>Marca</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.id}"></td>
                <td th:text="${product.descripcion}"></td>
                <td th:text="${'$' + product.precio}"></td>
                <td th:text="${product.cantidad}"></td>
                <td th:text="${product.categoria.descripcion}"></td>
                <td th:text="${product.marca.descripcion}"></td>
                <td class="text-nowrap">
                    <a class="btn btn-sm btn-outline-primary"
                       th:href="@{/products/edit/{id}(id=${product.id})}">
                        Editar
                    </a>

                    <form class="d-inline"
                          th:action="@{/products/delete/{id}(id=${product.id})}"
                          method="post"
                          onsubmit="return confirm('¿Eliminar este producto?');">
                        <button class="btn btn-sm btn-outline-danger" type="submit">
                            Eliminar
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
