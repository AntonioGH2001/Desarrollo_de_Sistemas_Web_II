<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agregar producto | Tienda Sara</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
<main class="container py-4">
    <h1 class="mb-3">Agregar producto</h1>

    <form th:action="@{/products/create}" th:object="${productDto}" method="post">
        <div class="mb-3">
            <label class="form-label" for="descripcion">Descripción</label>
            <input class="form-control" id="descripcion" type="text"
                   th:field="*{descripcion}" maxlength="200" required>
        </div>

        <div class="mb-3">
            <label class="form-label" for="precio">Precio</label>
            <input class="form-control" id="precio" type="number"
                   th:field="*{precio}" min="0" step="0.01" required>
        </div>

        <div class="mb-3">
            <label class="form-label" for="cantidad">Cantidad</label>
            <input class="form-control" id="cantidad" type="number"
                   th:field="*{cantidad}" min="0" step="1" required>
        </div>

        <div class="mb-3">
            <label class="form-label" for="categoriaId">Categoría</label>
            <select class="form-select" id="categoriaId" th:field="*{categoriaId}" required>
                <option value="">Selecciona una categoría</option>
                <option th:each="category : ${categories}"
                        th:value="${category.id}"
                        th:text="${category.descripcion}">
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label" for="marcaId">Marca</label>
            <select class="form-select" id="marcaId" th:field="*{marcaId}" required>
                <option value="">Selecciona una marca</option>
                <option th:each="mark : ${marks}"
                        th:value="${mark.id}"
                        th:text="${mark.descripcion}">
                </option>
            </select>
        </div>

        <button class="btn btn-primary" type="submit">Guardar</button>
        <a class="btn btn-secondary" th:href="@{/products}">Cancelar</a>
    </form>
</main>
</body>
</html>
